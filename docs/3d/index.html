<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drawn Codes 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f4f4f4;
               font-family: -apple-system, system-ui, sans-serif; }
  #view { position: fixed; inset: 0 240px 0 0; }
  #panel { position: fixed; top: 0; right: 0; bottom: 0; width: 240px;
           background: #1c1c1c; color: #eee; padding: 14px; box-sizing: border-box;
           display: flex; flex-direction: column; gap: 12px; font-size: 13px;
           overflow-y: auto; }
  #panel h1 { font-size: 15px; margin: 0; font-weight: 600; }
  #panel a { color: #7ab0ff; text-decoration: none; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { flex: 1; }
  .row input[type=number] { width: 64px; background: #333; color: #fff;
       border: 1px solid #555; border-radius: 3px; padding: 4px; }
  .layer { display: flex; align-items: center; gap: 8px; padding: 6px;
           background: #262626; border-radius: 4px; }
  .swatch { width: 20px; height: 20px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,.4); flex: none; }
  .layer input[type=number] { width: 52px; background: #333; color: #fff;
       border: 1px solid #555; border-radius: 3px; padding: 3px; }
  .layer button { background: #3a3a3a; color: #ccc; border: none;
       border-radius: 3px; padding: 4px 7px; cursor: pointer; font-size: 11px; }
  button.big { background: #285a96; color: #fff; border: none; border-radius: 4px;
       padding: 11px; font-size: 14px; cursor: pointer; }
  button.mid { background: #3a3a3a; color: #eee; border: none; border-radius: 4px;
       padding: 8px; font-size: 13px; cursor: pointer; }
  #status { color: #9a9a9a; font-size: 11px; min-height: 26px; }
  #ver { color: #777; font-size: 11px; margin-top: auto; }
  @media (max-width: 700px) {
    #view { inset: 0 0 260px 0; }
    #panel { top: auto; left: 0; width: auto; height: 260px; }
  }
</style>
</head>
<body>
<div id="view"></div>
<div id="panel">
  <h1>Drawn Codes 3D</h1>
  <div><a href="../" >← drawing tool</a></div>
  <div class="row"><label>mm per cell</label>
    <input type="number" id="mmcell" value="4" min="0.5" step="0.5"></div>
  <div id="layers"></div>
  <button class="mid" id="reload">RELOAD DRAWING</button>
  <button class="big" id="stl">EXPORT STL (all)</button>
  <div id="status"></div>
  <div id="ver"></div>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="app.js?v=3d011"></script>
</body>
</html>
